services:
  nginx:
    image: nginx:latest
    container_name: pet-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/www:/var/www/certbot
      - ./hugo/site/public:/usr/share/nginx/html
    depends_on:
      - hugo

  hugo:
    image: klakegg/hugo:ext-alpine
    container_name: pet-hugo
    restart: on-failure
    volumes:
      - ./hugo/site:/src
    command:
      --destination /src/public --watch --buildDrafts --verbose
